    <script>
      // Tema diterapkan sebelum render pertama agar halaman tidak berkedip terang lalu gelap.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('uo-theme'); } catch (e) { saved = null; }
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // Warna bilah browser mengikuti --color-surface (warna header).
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0A0A0A' : '#FFFFFF');
      })();
    </script>
